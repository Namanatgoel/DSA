name: Sync LeetCode Solutions

on:
  workflow_dispatch: # Allows you to manually trigger the sync anytime
  schedule:
    - cron: '0 8 * * *' # Automatically runs every single day at 8:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and Sync LeetCode Submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'Leetcode Solutions' # Folder where code will be saved
